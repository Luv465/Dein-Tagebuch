
name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Xcode-Version wählen
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Ohne Signierung archivieren
        run: |
          xcodebuild \
            -project MeinTagebuch.xcodeproj \
            -scheme MeinTagebuch \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/MeinTagebuch.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: IPA aus Archiv packen
        run: |
          APP_PATH="$RUNNER_TEMP/MeinTagebuch.xcarchive/Products/Applications/MeinTagebuch.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "FEHLER: .app wurde nicht gefunden unter $APP_PATH"
            ls -R "$RUNNER_TEMP/MeinTagebuch.xcarchive/Products" || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r -y "MeinTagebuch.ipa" "Payload"
          echo "IPA erstellt:"
          ls -lh "$RUNNER_TEMP/MeinTagebuch.ipa"

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: MeinTagebuch-unsigned-ipa
          path: ${{ runner.temp }}/MeinTagebuch.ipa
          if-no-files-found: error
